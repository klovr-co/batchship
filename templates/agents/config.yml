# Settings every agent and every tug command reads (https://github.com/klovr-co/batchship). Change them here, nowhere else.
# `tug init` adds keys that are missing and never changes the ones you set.

# Where "ship", "merge", "go" and "make it live" go: production or staging.
#   staging:    merge into the staging branch; production only when the owner says "release", "promote", "production", "prod" or "main".
#   production: straight to production.
shipTarget: {{shipTarget}}

branches:
  production: {{production}}
  staging: {{staging}}

# Changes that wait for the owner's yes: label needs-owner and a first line "Needs owner: <the decision>".
needsOwner:
  paths:{{needsOwnerPaths}}
  categories:{{needsOwnerCategories}}

# The repo's own pre-push check, run after tug's line-ending and generated-file checks (git's pre-push stdin is
# passed through). null: none. The adopt skill writes it from what CI runs cheaply.
checkCommand: {{checkCommand}}

# How a fresh worktree installs dependencies. null: tug detects it from the lockfile and version pins.
installCommand: {{installCommand}}

# Generators whose output is committed: the pre-push gate runs each and fails if the tree changes.
generated:{{generated}}

# Workflow files that deploy a merge into the ship branch; `tug ship` waits for their runs on the merge commit.
deployWorkflows:{{deployWorkflows}}

# Where to look after a deploy.
liveUrl: {{liveUrl}}

# How the merge queue merges each PR: squash, merge (its own merge commit, so bisect and revert work per PR) or rebase.
mergeMethod: {{mergeMethod}}

# The check the merge queue waits for on its batch draft: the name of the CI gate job (templates/ci/gate.snippet.yml).
ciCheck: {{ciCheck}}
