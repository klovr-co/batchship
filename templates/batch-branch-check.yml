# Dry run: warns only. Set SHIP_ENFORCE to "1" after a week of clean runs.
# Revert: delete this file. Runs only when a PR is ready (drafts cost nothing).
name: batch-branch-check
on:
  pull_request:
    branches: __BRANCHES__
    types: [opened, reopened, synchronize, ready_for_review]
jobs:
  branch:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .batchship/branch-check.mjs
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          SHIP_ENFORCE: "0"
